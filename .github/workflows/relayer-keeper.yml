name: Aegis Autonomous Relayer Keeper

on:
  schedule:
    # Fallback serverless cloud keeper (every 10 minutes); telemetry is stored directly on-chain
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-relayer-keeper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Stateless Autonomous Sweep Cycle
        env:
          CONTRACT_ID: aegis.okgoogleok.testnet
          RELAYER_ACCOUNT_ID: keeper.aegis.okgoogleok.testnet
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
          NEAR_RPC_URL: https://test.rpc.fastnear.com
          SOLANA_RPC_URL: https://api.devnet.solana.com
          EVM_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: |
          node relayer/service.js --sweep-all
