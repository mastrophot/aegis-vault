name: LastKey Bunker Autonomous Relayer Keeper

on:
  schedule:
    # Self-healing watchdog cron (every 5m) + continuous 5-second cloud keeper loop
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: aegis-relayer-keeper
  cancel-in-progress: false

jobs:
  run-relayer-keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Continuous 3s Autonomous Sweep & Alert Loop
        env:
          CONTRACT_ID: aegis.okgoogleok.testnet
          RELAYER_ACCOUNT_ID: keeper.aegis.okgoogleok.testnet
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEAR_RPC_URL: https://test.rpc.fastnear.com
          SOLANA_RPC_URL: https://solana-devnet.api.onfinality.io/public
          EVM_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: |
          node relayer/service.js --daemon-minutes 55 --interval-ms 3000

      - name: Chain Next 24/7 Keeper Window
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run relayer-keeper.yml --ref main || true
