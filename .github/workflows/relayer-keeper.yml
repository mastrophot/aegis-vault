name: Aegis Autonomous Relayer Keeper

on:
  schedule:
    # Runs every 10 minutes automatically in the cloud
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-relayer-keeper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Stateless Autonomous Sweep Cycle
        env:
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY || 'ed25519:4x6ax7etHYmUHG5iCWL9FnTZhEZnK48D47nQo95xkDK8rR6wFNxdbUxD4HNfyP3GA1P6dCycSvFaMvFnfA1dZdg9' }}
        run: |
          node relayer/service.js --sweep-all

      - name: Deploy Updated Telemetry to GitHub Pages
        run: |
          git config --global user.name "Aegis Cloud Keeper"
          git config --global user.email "bot@aegis-vault.io"
          git add web/telemetry.json
          git commit -m "chore(telemetry): automated multichain sweep telemetry sync [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or up-to-date"
