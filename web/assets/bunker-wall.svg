<svg width="180" height="180" xmlns="http://www.w3.org/2000/svg">
  <!-- Reinforced Bunker Concrete Plate -->
  <rect width="180" height="180" fill="#07090D"/>
  
  <!-- Recessed Blast Panel Plate -->
  <rect x="3" y="3" width="174" height="174" fill="#0A0D14" stroke="rgba(255,255,255,0.02)" stroke-width="1" rx="2"/>
  
  <!-- Expansion Seams (Deep Inset Joint Grooves) -->
  <line x1="0" y1="1" x2="180" y2="1" stroke="#030406" stroke-width="2.5"/>
  <line x1="0" y1="2.5" x2="180" y2="2.5" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  <line x1="1" y1="0" x2="1" y2="180" stroke="#030406" stroke-width="2.5"/>
  <line x1="2.5" y1="0" x2="2.5" y2="180" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  
  <!-- Heavy Structural Anchor Rivets / Blast Bolts -->
  <!-- Top Left Bolt -->
  <circle cx="16" cy="16" r="3" fill="#111622" stroke="#040508" stroke-width="1"/>
  <circle cx="16" cy="16" r="1.2" fill="rgba(255,255,255,0.18)"/>
  <!-- Top Right Bolt -->
  <circle cx="164" cy="16" r="3" fill="#111622" stroke="#040508" stroke-width="1"/>
  <circle cx="164" cy="16" r="1.2" fill="rgba(255,255,255,0.18)"/>
  <!-- Bottom Left Bolt -->
  <circle cx="16" cy="164" r="3" fill="#111622" stroke="#040508" stroke-width="1"/>
  <circle cx="16" cy="164" r="1.2" fill="rgba(255,255,255,0.18)"/>
  <!-- Bottom Right Bolt -->
  <circle cx="164" cy="164" r="3" fill="#111622" stroke="#040508" stroke-width="1"/>
  <circle cx="164" cy="164" r="1.2" fill="rgba(255,255,255,0.18)"/>
  
  <!-- Subtle Internal Reinforcement Crosshairs at Panel Center -->
  <circle cx="90" cy="90" r="1.5" fill="rgba(255,255,255,0.035)"/>
</svg>