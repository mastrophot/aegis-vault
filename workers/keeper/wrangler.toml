name = "aegis-keeper"
main = "index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
minify = true

# Set restricted FunctionCall key securely via CLI (never commit secrets):
# npx wrangler secret put RELAYER_PRIVATE_KEY

[alias]
"js-sha256" = "./shims/js-sha256.js"

# Uncomment `[triggers]` on a claimed Cloudflare account to enable 1-minute autonomous cron
# (`scheduled()` handler is already exported in `index.js`; GitHub Actions cron runs 24/7 in parallel):
# [triggers]
# crons = ["* * * * *"]

[vars]
NEAR_NETWORK = "testnet"
NEAR_RPC_URL = "https://test.rpc.fastnear.com"
CONTRACT_ID = "aegis.okgoogleok.testnet"
RELAYER_ACCOUNT_ID = "keeper.aegis.okgoogleok.testnet"
SOLANA_RPC_URL = "https://solana-devnet.api.onfinality.io/public"
EVM_RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com"
