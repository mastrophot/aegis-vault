services:
  - type: web
    name: aegis-relayer-keeper
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node relayer/service.js --server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CONTRACT_ID
        value: aegis.okgoogleok.testnet
      - key: RELAYER_ACCOUNT_ID
        value: keeper.aegis.okgoogleok.testnet
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: NEAR_NETWORK
        value: testnet
      - key: NEAR_RPC_URL
        value: https://test.rpc.fastnear.com
      - key: SOLANA_RPC_URL
        value: https://solana-devnet.api.onfinality.io/public
      - key: EVM_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
